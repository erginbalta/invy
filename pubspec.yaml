name: invy
description: Offline-first mobile inventory tracking for individuals and small businesses.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  sqflite: ^2.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
